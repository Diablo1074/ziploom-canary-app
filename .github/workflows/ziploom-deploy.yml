# ziploom-build-workflow: v11
# Generated by ZipLoom — do not edit by hand.
# Build-only: builds the app and uploads the artifact. ZipLoom
# downloads the artifact and performs the gated deploy itself.
name: ZipLoom Build
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: ZipLoom deployment id
        required: true
      build_ref:
        description: Exact commit ZipLoom scanned (empty = the dispatched branch)
        required: false
        default: ""
      build_env:
        description: Public build settings (JSON; public-prefixed names only)
        required: false
        default: "{}"
      artifact_mode:
        description: static = build output only; app = runnable app for a server; worker = Cloudflare Workers bundle
        required: false
        type: choice
        options: [static, app, worker]
        default: static
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.build_ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build for Cloudflare Workers
        if: inputs.artifact_mode == 'worker'
        run: |
          if node -e 'const p=require("./package.json");const d={...(p.dependencies||{}),...(p.devDependencies||{})};process.exit(d["@opennextjs/cloudflare"]?0:1)'; then
            npx opennextjs-cloudflare build
          elif node -e 'const p=require("./package.json");const d={...(p.dependencies||{}),...(p.devDependencies||{})};process.exit(d["next"]?0:1)'; then
            npm install --no-save --no-audit --no-fund @opennextjs/cloudflare@1.20.14 wrangler@4.151.3
            npx opennextjs-cloudflare build
          elif [ ! -f wrangler.jsonc ] && [ ! -f wrangler.json ] && node -e 'const p=require("./package.json");const d={...(p.dependencies||{}),...(p.devDependencies||{})};process.exit(d["express"]?0:1)'; then
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const ok = (f) => { if (typeof f !== "string") return null; const p = f.trim().replace(/^\.\//, "");
                if (!p || p.startsWith("/") || p.split("/").includes("..") || !/\.(c|m)?js$/.test(p)) return null; return p; };
              const m = /^node\s+(?:--\S+\s+)*(\S+)\s*$/.exec(String((pkg.scripts || {}).start || "").trim());
              const entry = ok(pkg.main) || (m ? ok(m[1]) : null);
              if (!entry || !fs.existsSync(entry)) { console.error("Could not find the file that starts your server: set main in package.json."); process.exit(1); }
              const dir = ".zl-node";
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(dir + "/listen.js", [
                "import http from \"node:http\";",
                "export const PORT = 8787;",
                "const listen = http.Server.prototype.listen;",
                "http.Server.prototype.listen = function (...args) { return listen.call(this, PORT, args.find((a) => typeof a === \"function\")); };",
              ].join("\n") + "\n");
              fs.writeFileSync(dir + "/worker-entry.js", [
                "import { PORT } from \"./listen.js\";",
                "import " + JSON.stringify("../" + entry) + ";",
                "import { httpServerHandler } from \"cloudflare:node\";",
                "export default httpServerHandler({ port: PORT });",
              ].join("\n") + "\n");
              fs.writeFileSync("wrangler.jsonc", JSON.stringify({ name: "ziploom-app", main: dir + "/worker-entry.js", compatibility_date: "2025-09-01", compatibility_flags: ["nodejs_compat"] }, null, 2) + "\n");
              console.log("Wrapped " + entry + " for Cloudflare Workers.");
            '
          else
            true
          fi
          npx --yes wrangler@4.151.3 deploy --dry-run --outdir .zl-worker
      - name: Stage the Worker artifact
        if: inputs.artifact_mode == 'worker'
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const name = ["wrangler.jsonc", "wrangler.json"].find((f) => fs.existsSync(f));
            if (!name) { console.error("No wrangler.jsonc or wrangler.json in the app folder."); process.exit(1); }
            const cfg = new Function("return (" + fs.readFileSync(name, "utf8") + "\n)")();
            fs.rmSync(".zl-artifact", { recursive: true, force: true });
            fs.mkdirSync(".zl-artifact");
            fs.cpSync(".zl-worker", ".zl-artifact/worker", { recursive: true, filter: (f) => !/\.(map|md)$/.test(f) });
            const dir = cfg && cfg.assets && cfg.assets.directory;
            if (dir) fs.cpSync(dir, ".zl-artifact/assets", { recursive: true });
            fs.copyFileSync(name, ".zl-artifact/wrangler-source." + (name.endsWith("c") ? "jsonc" : "json"));
            fs.writeFileSync(".zl-artifact/zl-entry.txt", path.basename(String(cfg.main || "")).replace(/\.(ts|tsx|mts|cts|jsx)$/, ".js"));
          '
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.artifact_mode == 'static'
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: |
            dist
            !dist/**/.env*
            !dist/**/.git/**
            !dist/**/node_modules/**
            !dist/**/.dev.vars
            !dist/**/*.pem
            !dist/**/*.key
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.artifact_mode == 'app'
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: |
            .
            !**/node_modules/**
            !**/.git/**
            !**/.env*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.artifact_mode == 'worker'
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: |
            .zl-artifact
            !.zl-artifact/**/.env*
            !.zl-artifact/**/.dev.vars
            !.zl-artifact/**/*.pem
            !.zl-artifact/**/*.key
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
